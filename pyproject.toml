[project]
name = "seed-image"
version = "0.1.0"
description = "给 AI agent 用的图像生成 CLI：ComfyUI 工作流 + OpenAI 兼容图片接口"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "typer>=0.27.1",
]

[project.scripts]
seed-image = "seed_image:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
